services:
  frontend:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    environment:
      # nginx 反向代理 /api 的目标后端地址，按实际部署覆盖
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
